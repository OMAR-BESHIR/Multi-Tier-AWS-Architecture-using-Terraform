<svg width="900" height="700" viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg" style="background:white;font-family:Arial,sans-serif">

  <!-- VPC outer -->
  <rect x="20" y="20" width="860" height="660" rx="18" fill="#F8FBFF" stroke="#2563EB" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="40" y="48" font-size="14" font-weight="bold" fill="#2563EB">VPC — 10.0.0.0/16  |  us-east-1</text>

  <!-- Internet box -->
  <rect x="370" y="30" width="160" height="40" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="450" y="55" font-size="13" font-weight="bold" fill="#1D4ED8" text-anchor="middle">🌐 Internet</text>

  <!-- Arrow Internet → ALB -->
  <line x1="450" y1="70" x2="450" y2="115" stroke="#2563EB" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Public subnets -->
  <rect x="40" y="115" width="820" height="130" rx="10" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="56" y="135" font-size="12" font-weight="bold" fill="#15803D">Public Subnets</text>

  <!-- Subnet A public -->
  <rect x="55" y="140" width="330" height="92" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="1"/>
  <text x="220" y="158" font-size="11" fill="#166534" text-anchor="middle" font-weight="bold">us-east-1a · 10.0.10.0/24</text>
  <rect x="70" y="165" width="140" height="52" rx="6" fill="#16A34A" stroke="#15803D" stroke-width="1"/>
  <text x="140" y="186" font-size="11" fill="white" text-anchor="middle" font-weight="bold">NAT Gateway A</text>
  <text x="140" y="202" font-size="10" fill="#BBF7D0" text-anchor="middle">EIP attached</text>

  <!-- Subnet B public -->
  <rect x="515" y="140" width="330" height="92" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="1"/>
  <text x="680" y="158" font-size="11" fill="#166534" text-anchor="middle" font-weight="bold">us-east-1b · 10.0.20.0/24</text>
  <rect x="690" y="165" width="140" height="52" rx="6" fill="#16A34A" stroke="#15803D" stroke-width="1"/>
  <text x="760" y="186" font-size="11" fill="white" text-anchor="middle" font-weight="bold">NAT Gateway B</text>
  <text x="760" y="202" font-size="10" fill="#BBF7D0" text-anchor="middle">EIP attached</text>

  <!-- ALB spanning -->
  <rect x="280" y="155" width="340" height="60" rx="8" fill="#1D4ED8" stroke="#1E3A8A" stroke-width="1.5"/>
  <text x="450" y="180" font-size="13" fill="white" text-anchor="middle" font-weight="bold">Application Load Balancer</text>
  <text x="450" y="198" font-size="10" fill="#BFDBFE" text-anchor="middle">Internet-facing · HTTP:80 · ALBSG</text>

  <!-- Arrows ALB → EC2 -->
  <line x1="340" y1="215" x2="240" y2="310" stroke="#1D4ED8" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="560" y1="215" x2="660" y2="310" stroke="#1D4ED8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Private subnets web tier -->
  <rect x="40" y="295" width="820" height="160" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="56" y="315" font-size="12" font-weight="bold" fill="#B45309">Private Subnets — Web / App Tier</text>

  <!-- Private Subnet A web -->
  <rect x="55" y="320" width="355" height="122" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1"/>
  <text x="232" y="338" font-size="11" fill="#92400E" text-anchor="middle" font-weight="bold">us-east-1a · 10.0.100.0/24</text>
  <rect x="75" y="347" width="315" height="82" rx="6" fill="#D97706" stroke="#B45309" stroke-width="1"/>
  <text x="232" y="370" font-size="12" fill="white" text-anchor="middle" font-weight="bold">EC2 — Web Server A</text>
  <text x="232" y="388" font-size="10" fill="#FEF3C7" text-anchor="middle">Ubuntu · Apache2 · t3.micro</text>
  <text x="232" y="404" font-size="10" fill="#FEF3C7" text-anchor="middle">EBS Encrypted · SSM Access</text>

  <!-- Private Subnet B web -->
  <rect x="490" y="320" width="355" height="122" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1"/>
  <text x="667" y="338" font-size="11" fill="#92400E" text-anchor="middle" font-weight="bold">us-east-1b · 10.0.200.0/24</text>
  <rect x="510" y="347" width="315" height="82" rx="6" fill="#D97706" stroke="#B45309" stroke-width="1"/>
  <text x="667" y="370" font-size="12" fill="white" text-anchor="middle" font-weight="bold">EC2 — Web Server B</text>
  <text x="667" y="388" font-size="10" fill="#FEF3C7" text-anchor="middle">Ubuntu · Apache2 · t3.micro</text>
  <text x="667" y="404" font-size="10" fill="#FEF3C7" text-anchor="middle">EBS Encrypted · SSM Access</text>

  <!-- ASG badge -->
  <rect x="390" y="340" width="120" height="28" rx="6" fill="#7C3AED" stroke="#5B21B6" stroke-width="1"/>
  <text x="450" y="359" font-size="11" fill="white" text-anchor="middle" font-weight="bold">Auto Scaling Group</text>

  <!-- NAT arrows (dashed, private → nat) -->
  <line x1="140" y1="320" x2="140" y2="232" stroke="#D97706" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arr)"/>
  <line x1="760" y1="320" x2="760" y2="232" stroke="#D97706" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arr)"/>

  <!-- Arrows EC2 → RDS -->
  <line x1="232" y1="455" x2="300" y2="510" stroke="#BE185D" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="667" y1="455" x2="600" y2="510" stroke="#BE185D" stroke-width="2" marker-end="url(#arr)"/>

  <!-- RDS container -->
  <rect x="40" y="490" width="820" height="170" rx="10" fill="#FDF2F8" stroke="#BE185D" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="56" y="510" font-size="12" font-weight="bold" fill="#BE185D">Private Subnets — Database Tier (Multi-AZ)</text>

  <!-- RDS Primary -->
  <rect x="70" y="520" width="310" height="126" rx="8" fill="#EC4899" stroke="#BE185D" stroke-width="1"/>
  <text x="225" y="544" font-size="13" fill="white" text-anchor="middle" font-weight="bold">RDS Primary</text>
  <text x="225" y="562" font-size="10" fill="#FCE7F3" text-anchor="middle">MySQL · db.t3.micro · us-east-1a</text>
  <text x="225" y="578" font-size="10" fill="#FCE7F3" text-anchor="middle">Encrypted at rest</text>
  <text x="225" y="594" font-size="10" fill="#FCE7F3" text-anchor="middle">Secrets Manager credentials</text>
  <text x="225" y="610" font-size="10" fill="#FCE7F3" text-anchor="middle">Subnet Group: rds-subnet-group</text>
  <text x="225" y="626" font-size="10" fill="#FCE7F3" text-anchor="middle">SG: db-sg (allows port 3306 from webSG)</text>

  <!-- RDS Standby -->
  <rect x="520" y="520" width="310" height="126" rx="8" fill="#F9A8D4" stroke="#BE185D" stroke-width="1"/>
  <text x="675" y="544" font-size="13" fill="#831843" text-anchor="middle" font-weight="bold">RDS Standby</text>
  <text x="675" y="562" font-size="10" fill="#9D174D" text-anchor="middle">us-east-1b · Auto failover</text>
  <text x="675" y="578" font-size="10" fill="#9D174D" text-anchor="middle">Synchronous replication</text>
  <text x="675" y="594" font-size="10" fill="#9D174D" text-anchor="middle">Promoted on primary failure</text>

  <!-- Replication arrow -->
  <line x1="380" y1="583" x2="518" y2="583" stroke="#BE185D" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arr)"/>
  <text x="450" y="576" font-size="10" fill="#BE185D" text-anchor="middle">sync replication</text>

  <!-- Arrow marker -->
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

</svg>
